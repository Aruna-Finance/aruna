[package]
name = "drift-target"
edition.workspace = true
version.workspace = true
publish = false
repository = "https://github.com/Aruna-Finance/aruna"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[features]
v2 = []


[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
